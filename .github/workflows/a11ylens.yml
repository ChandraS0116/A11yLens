name: "A11yLens Automated Accessibility Gate"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  accessibility-audit:
    name: "WCAG 2.2 Compliance & SARIF Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Audit Engine Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run A11yLens Audit Engine & Export SARIF
        run: |
          python backend/cli.py https://example.com --format sarif --output a11ylens-report.sarif --min-score 80

      - name: Upload Results to GitHub Security (Code Scanning)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: a11ylens-report.sarif
